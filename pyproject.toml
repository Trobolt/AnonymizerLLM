[tool.ruff]
target-version = "py311"   # minimum Python version to target
line-length = 88            # max line length before formatter wraps

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (spacing, indentation)
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modernise syntax, e.g. List -> list)
]
ignore = [
    "E501",  # line too long — ruff format handles this, not the linter
]
fixable = ["ALL"]   # allow --fix to auto-correct everything it can

[tool.ruff.format]
quote-style = "double"   # double quotes (consistent with Python convention)
indent-style = "space"   # spaces, not tabs

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # skip errors for libraries that have no type stubs
warn_return_any = true          # warn when a function returns Any without annotation
warn_unused_configs = true      # warn if a mypy config section has no effect

[tool.pytest.ini_options]
testpaths = ["tests/backend"]   # where pytest looks for test files
pythonpath = ["."]              # adds repo root to sys.path so `import backend.main` works
asyncio_mode = "auto"           # treat async def test_* as async tests automatically
